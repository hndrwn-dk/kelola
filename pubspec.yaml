name: kelola
description: Agentless Linux server administration from a phone.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.28.1
  drift_flutter: ^0.2.4
  dartssh2: ^3.3.1
  qr_flutter: ^4.1.0
  uuid: ^4.5.1
  path: ^1.9.1
  path_provider: ^2.1.5
  collection: ^1.19.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.2
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon_1024.png
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 26

flutter_native_splash:
  color: "#0D1117"
  image: assets/splash/splash_screen.png
  android: true
  ios: true
  android_12:
    # Android 12+ only shows a centered icon in a circle, never the
    # 1170x2532 full-screen splash. Keep this asset square and tight.
    color: "#0D1117"
    image: assets/splash/android12_icon.png

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
