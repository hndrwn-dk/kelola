# Kelola Android CI: release-metadata gate + analyze + unit/widget tests.
#
# CI never builds or uploads a Play AAB. Releases are built locally with
# scripts/build_play_aab.sh and uploaded by hand in Play Console, so the
# versionCode is always pubspec `version: name+N` (single source of truth).
name: app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Release metadata gate
        shell: bash
        run: |
          set -euo pipefail
          # A release = versionName (before `+`) changes. It must ship with
          # fresh whatsnew notes, a strictly greater versionName, and a
          # strictly greater versionCode (+N) — Play rejects a manual upload
          # whose versionCode is not higher than the last one.
          read_version() {
            awk -F': ' '/^version:/ {gsub(/\r/, "", $2); gsub(/ /, "", $2); print $2; exit}'
          }
          version_at() {
            local ref="$1"
            if ! git cat-file -e "${ref}:pubspec.yaml" 2>/dev/null; then
              echo ""
              return
            fi
            git show "${ref}:pubspec.yaml" | read_version
          }
          semver_gt() {
            python3 - "$1" "$2" <<'PY'
          import sys
          def parts(s):
              return [int(x) for x in s.split(".")]
          a, b = parts(sys.argv[1]), parts(sys.argv[2])
          n = max(len(a), len(b))
          a += [0] * (n - len(a))
          b += [0] * (n - len(b))
          sys.exit(0 if a > b else 1)
          PY
          }

          version_line="$(read_version < pubspec.yaml)"
          version_name="${version_line%%+*}"
          version_code="${version_line##*+}"
          if [[ "$version_name" == "$version_line" || ! "$version_code" =~ ^[0-9]+$ ]]; then
            echo "::error file=pubspec.yaml::version must be name+N (got $version_line)."
            exit 1
          fi

          event="${{ github.event_name }}"
          base=""
          if [[ "$event" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "$event" == "push" ]]; then
            base="${{ github.event.before }}"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::notice::No comparable base commit; version $version_line not gated."
            exit 0
          fi

          before_line="$(version_at "$base")"
          before_name="${before_line%%+*}"
          before_code="${before_line##*+}"
          if [[ -z "$before_name" || "$before_name" == "$version_name" ]]; then
            echo "::notice::No release — versionName unchanged ($version_line)."
            exit 0
          fi

          if ! semver_gt "$version_name" "$before_name"; then
            echo "::error file=pubspec.yaml::versionName $version_name must be strictly greater than $before_name."
            exit 1
          fi
          if [[ "$before_code" =~ ^[0-9]+$ ]] && (( version_code <= before_code )); then
            echo "::error file=pubspec.yaml::versionCode +$version_code must be strictly greater than +$before_code."
            exit 1
          fi
          if ! git diff --name-only "$base" HEAD | grep -qx 'docs/store/whatsnew/whatsnew-en-US'; then
            echo "::error file=docs/store/whatsnew/whatsnew-en-US::versionName changed ($before_name → $version_name) but whatsnew-en-US was not updated."
            exit 1
          fi
          notes="$(tr -d '\r' < docs/store/whatsnew/whatsnew-en-US)"
          if [[ -z "${notes// }" ]]; then
            echo "::error file=docs/store/whatsnew/whatsnew-en-US::whatsnew-en-US is empty."
            exit 1
          fi
          chars="$(printf '%s' "$notes" | wc -c)"
          if (( chars > 500 )); then
            echo "::error file=docs/store/whatsnew/whatsnew-en-US::whatsnew-en-US is ${chars} characters (max 500)."
            exit 1
          fi
          echo "::notice::Release $before_line → $version_line. Build locally with scripts/build_play_aab.sh and upload the AAB in Play Console."

      - name: Install SQLite (Drift)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set -euo pipefail
          # Repo already has analyzer infos + warnings; only fail on severity=error.
          # Format: "warning • message • path:line:col • code"
          set +e
          out="$(flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out"
          python3 - "$out" <<'PY'
          import re, sys
          text = sys.argv[1]
          # Leading spaces then severity • message • file:line:col • code
          pat = re.compile(
              r"^\s*(error|warning|info)\s+•\s+(.+?)\s+•\s+([^:]+):(\d+):(\d+)\s+•\s+(\S+)\s*$"
          )
          for line in text.splitlines():
              m = pat.match(line)
              if not m:
                  continue
              sev, msg, path, row, col, _code = m.groups()
              # GitHub annotations: errors fail the check UI; infos/warnings stay advisory.
              kind = "error" if sev == "error" else "warning"
              print(f"::{kind} file={path},line={row},col={col}::{msg}")
          PY
          exit "$code"

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          set +e
          flutter test --file-reporter=json:test.json
          code=$?
          set -e
          if [[ "$code" -ne 0 ]]; then
            python3 - <<'PY'
          import json, pathlib, sys
          path = pathlib.Path("test.json")
          if not path.exists():
              print("::error::flutter test failed and test.json is missing")
              sys.exit(1)
          failed = []
          names = {}
          for line in path.read_text(encoding="utf-8", errors="replace").splitlines():
              line = line.strip()
              if not line:
                  continue
              try:
                  ev = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if not isinstance(ev, dict):
                  continue
              if ev.get("type") == "testStart":
                  t = ev.get("test") or {}
                  if isinstance(t, dict):
                      names[t.get("id")] = t.get("name", "?")
              if ev.get("type") == "testDone" and ev.get("result") == "error":
                  tid = ev.get("testID")
                  failed.append(f"{names.get(tid, tid)}: testDone error")
              if ev.get("type") != "error":
                  continue
              # Flutter file-reporter: "error" may be a string or an object.
              err = ev.get("error")
              if isinstance(err, dict):
                  test_id = err.get("testID")
                  raw = err.get("error") or err.get("stackTrace") or "failed"
                  message = str(raw).splitlines()[0]
                  failed.append(f"testID={test_id}: {message}")
              else:
                  tid = ev.get("testID")
                  message = str(err or "failed").splitlines()[0]
                  name = names.get(tid, tid)
                  failed.append(f"{name}: {message}")
          body = "%0A".join(failed[:40]) if failed else "flutter test failed (see log)"
          print(f"::error file=.github/workflows/app.yml::{body}")
          sys.exit(1)
          PY
          fi
